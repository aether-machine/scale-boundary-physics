[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "scale-boundary-physics"
version = "0.1.0"
description = "Computational investigation of scale boundaries, coarse-graining, and effective dynamics."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]


[project.optional-dependencies]
test = [
    "pytest>=8.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
